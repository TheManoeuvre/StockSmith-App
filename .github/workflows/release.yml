name: Release

# Builds and publishes a signed StockSmith release whenever a version tag (v*) is pushed.
# The resulting GitHub Release is a draft — review it and click Publish manually before
# it becomes the "latest" release the installed app's auto-updater will pick up.
#
# Windows-only: this app only targets Windows (NSIS installer), so there's no
# cross-platform build matrix here.

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag whose build failed, or never fired: without this the only
  # way to retry is to delete and re-push the tag, which rewrites a release marker to
  # work around a CI problem.
  #
  # The version input also makes a release possible without pushing a tag at all, which
  # is what a Claude Code cloud session needs: its git proxy permits pushes only to the
  # session's working branch, so `git push origin v1.2.3` is refused outright while
  # dispatching this workflow through the API is not.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.7.1. Leave blank when re-running a tag build."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Which version is being released. A tag push reads it from the tag; a manual run has
      # to say so explicitly, because github.ref_name is then the *branch* name — dispatching
      # from main without this produced a release tagged "main" carrying fallback notes.
      #
      # Read through env rather than interpolated into the script body: a ${{ }} expression
      # holding user input is executed as source, which is the standard Actions script
      # injection. Through env it is only ever data.
      - name: Resolve and check the version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:REF_NAME }
          if ($version -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Version must look like v1.2.3, got '$version'. A manual run needs the version input."
          }
          # The installer takes its version from tauri.conf.json, never from the tag, so a
          # mismatch ships a build whose version disagrees with the release holding it — and
          # the updater compares exactly those. Catches a mistyped input and a forgotten bump
          # alike, in seconds, rather than after a full signed build.
          $configured = (Get-Content frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne "v$configured") {
            throw "Releasing $version but frontend/src-tauri/tauri.conf.json says $configured."
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Full version rather than a bare major on purpose — setup-uv stopped publishing major
      # tags at v8. Keep this in step with the same pin in tests.yml, which explains it.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies
        run: uv sync --group build
        working-directory: backend

      - name: Build backend sidecar
        run: powershell -File backend/build.ps1

      # Extracts this tag's section from CHANGELOG.md so it becomes the GitHub Release
      # body — which tauri-action also writes into latest.json's `notes` field, which is
      # what the in-app update prompt displays. Without this the body is empty and the
      # prompt has nothing to show but a version number.
      #
      # The extraction itself lives in scripts/Get-ReleaseNotes.ps1 rather than inline,
      # because this workflow only runs on v* tags: anything embedded here is unexercised
      # until the moment it matters. The script is unit-tested by the Tests workflow.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $notes = ./scripts/Get-ReleaseNotes.ps1 -Version "${{ steps.version.outputs.value }}"
          "notes<<CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ steps.version.outputs.value }}
          releaseName: "StockSmith v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
