[package]
name = "stocksmith"
version = "0.1.0"
description = "StockSmith desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stocksmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon is what puts StockSmith in the notification area so it can keep syncing with
# the window closed (docs/plan-background-sync.md §1).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Autostart plus a Start-menu launch is two shells, both trying to spawn or adopt the same
# sidecar — so single-instance stops being optional once autostart exists (§2c).
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-store = "2.4.3"
tauri-plugin-upload = "2.4.0"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time"] }

